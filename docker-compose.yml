services:
  backend:
    build: .
    container_name: agora-scout-backend
    restart: unless-stopped
    ports:
      - "8001:8000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    environment:
      - DATABASE_PATH=/app/data/agora_scout.db
    dns:
      - 8.8.8.8
      - 1.1.1.1

  # Production static build served by nginx (replaces the Vite dev server).
  # nginx proxies /api and /ws to the backend over the compose network.
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: agora-scout-frontend
    restart: unless-stopped
    ports:
      - "3003:80"
    depends_on:
      - backend
